version: 2
updates:
  # Mantener dependencias de npm actualizadas
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      # Agrupar actualizaciones de Vue
      vue:
        patterns:
          - "vue"
          - "@vue/*"
          - "vue-*"
      # Agrupar actualizaciones de Vite
      vite:
        patterns:
          - "vite"
          - "vite-*"
          - "@vitejs/*"
      # Agrupar actualizaciones de testing
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "cypress"
      # Agrupar actualizaciones de TypeScript
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
          - "@typescript-eslint/*"
          - "@tsconfig/*"
      # Agrupar actualizaciones de ESLint
      eslint:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@vue/eslint-*"
      # Agrupar actualizaciones menores y patches
      npm_and_yarn:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    labels:
      - "dependencies"
      - "automated"

    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # Mantener actualizadas las acciones usadas por los workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    groups:
      actions-minors:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      actions-majors:
        patterns:
          - "*"
        update-types:
          - "major"

    labels:
      - "github-actions"
      - "automated"

    commit-message:
      prefix: "ci"

name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      security-events: write

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

    - name: Setup Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '22.x'

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10.17.1

    - name: Get pnpm store directory
      shell: bash
      run: |
        echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

    - name: Setup pnpm cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.STORE_PATH }}
        key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-pnpm-store-

    - name: Cache Cypress binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/Cypress
        key: ${{ runner.os }}-cypress-${{ hashFiles('**/pnpm-lock.yaml') }}
        restore-keys: |
          ${{ runner.os }}-cypress-

    - name: Install dependencies
      run: pnpm install --frozen-lockfile

    - name: Install Cypress binary
      run: pnpm cypress install

    - name: Type check
      run: pnpm run type-check

    - name: Lint
      run: pnpm lint

    - name: Build
      run: pnpm run build

    - name: Run Vitest tests with coverage
      run: pnpm test-headless-cc

    - name: Run Cypress component tests with coverage
      run: pnpm cypress:component:coverage

    - name: Merge coverage reports
      run: |
        # Create merged coverage directory
        mkdir -p coverage/merged
        
        # Copy Vitest coverage
        if [ -d "coverage" ] && [ -f "coverage/lcov.info" ]; then
          cp coverage/lcov.info coverage/merged/vitest-lcov.info || true
        fi
        
        # Copy Cypress coverage
        if [ -d "coverage/cypress" ] && [ -f "coverage/cypress/lcov.info" ]; then
          cp coverage/cypress/lcov.info coverage/merged/cypress-lcov.info || true
        fi
        
        # Merge coverage files if both exist
        if [ -f "coverage/merged/vitest-lcov.info" ] && [ -f "coverage/merged/cypress-lcov.info" ]; then
          npx lcov-result-merger 'coverage/merged/*-lcov.info' coverage/merged/lcov.info
        elif [ -f "coverage/merged/vitest-lcov.info" ]; then
          cp coverage/merged/vitest-lcov.info coverage/merged/lcov.info
        elif [ -f "coverage/merged/cypress-lcov.info" ]; then
          cp coverage/merged/cypress-lcov.info coverage/merged/lcov.info
        fi

    - name: Run Cypress component tests (verification)
      run: pnpm cypress:component

    - name: Security audit
      run: |
        pnpm audit || EXIT_CODE=$?
        if [ $EXIT_CODE -ne 0 ]; then
          echo "::warning::pnpm audit found vulnerabilities"
          pnpm audit --json > audit-results.json || true
        else
          echo "✅ pnpm audit found no vulnerabilities"
        fi

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@ba9859eae8dd6bd29e412f25ddbbef3d032000f4 # v8.2.2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        SONAR_HOST_URL: https://sonarcloud.io

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results
        path: |
          coverage/
          cypress/screenshots/
          cypress/videos/
        retention-days: 30
name: Security Audit

on:
  # Ejecutar diariamente a las 2 AM UTC
  schedule:
    - cron: '0 2 * * *'
  
  # Ejecutar en push a main y PRs
  push:
    branches: [main]
  pull_request:
    branches: [main]
  
  # Permitir ejecución manual
  workflow_dispatch:

jobs:
  security-audit:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      security-events: write
      actions: read
      issues: write
      pull-requests: write
    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.x'
      
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1
      
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      
      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      
      # 1. Auditoría de producción con pnpm (npm Advisory Database) — GATE DURO
      #    Se usa el exit code de pnpm para respetar `pnpm.auditConfig.ignoreCves`
      #    (pnpm devuelve 0 cuando solo quedan avisos ignorados); el JSON se usa
      #    únicamente para reportar el conteo.
      - name: pnpm audit (production gate)
        id: pnpm-audit-prod
        run: |
          echo "## pnpm audit --prod results" >> $GITHUB_STEP_SUMMARY
          AUDIT_EXIT=0
          pnpm audit --prod --json > pnpm-audit-prod.json 2>/dev/null || AUDIT_EXIT=$?

          if [ "$AUDIT_EXIT" -ne 0 ]; then
            PROD_VULNS=$(jq -r '[.metadata.vulnerabilities | values] | add // 0' pnpm-audit-prod.json 2>/dev/null || echo 0)
            case "$PROD_VULNS" in (*[!0-9]*|'') PROD_VULNS=1;; esac
            echo "Production vulnerabilities found: $PROD_VULNS" >> $GITHUB_STEP_SUMMARY
            echo "vulnerabilities=$PROD_VULNS" >> $GITHUB_OUTPUT
            echo "::error::Found $PROD_VULNS production vulnerabilities. Fix them before merging."
            exit 1
          fi

          echo "No production vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          echo "vulnerabilities=0" >> $GITHUB_OUTPUT

      # 2. Auditoría completa (dev + prod) — WARNING (riesgos dev-only aceptados)
      - name: pnpm audit (dev warning)
        id: pnpm-audit-dev
        run: |
          echo "## pnpm audit results" >> $GITHUB_STEP_SUMMARY
          pnpm audit --json > pnpm-audit.json || true

          if [ -s pnpm-audit.json ]; then
            # Accepted dev-only packages without upstream patch (see SECURITY_AUDIT_ANALYSIS.md)
            ACCEPTED="braces"
            TOTAL=$(jq -r '.metadata.vulnerabilities | add // 0' pnpm-audit.json 2>/dev/null || echo 0)
            ACCEPTED_COUNT=$(jq '[.advisories[] | select(.module_name as $m | ("'$ACCEPTED'" | split(" ") | index($m)))] | length' pnpm-audit.json 2>/dev/null || echo 0)
            case "$TOTAL" in (*[!0-9]*|'') TOTAL=0;; esac
            case "$ACCEPTED_COUNT" in (*[!0-9]*|'') ACCEPTED_COUNT=0;; esac
            DEV_VULNS=$(( TOTAL - ACCEPTED_COUNT ))
            echo "Total vulnerabilities found: $TOTAL (accepted: $ACCEPTED_COUNT)" >> $GITHUB_STEP_SUMMARY
            echo "vulnerabilities=$DEV_VULNS" >> $GITHUB_OUTPUT
            if [ "$DEV_VULNS" -gt 0 ]; then
              echo "::warning::Vulnerabilities found ($DEV_VULNS non-accepted, $TOTAL total, $ACCEPTED_COUNT accepted dev-only: $ACCEPTED). Production gate passed. See SECURITY_AUDIT_ANALYSIS.md for accepted risks."
            fi
          else
            echo "No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
            echo "vulnerabilities=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      # 3. Verificar dependencias desactualizadas
      - name: Check outdated dependencies
        id: outdated
        run: |
          echo "## Outdated dependencies" >> $GITHUB_STEP_SUMMARY
          pnpm outdated --format json > outdated.json || true
          
          if [ -s outdated.json ]; then
            COUNT=$(jq -r 'length' outdated.json 2>/dev/null || echo 0)
            case "$COUNT" in (*[!0-9]*|'') COUNT=0;; esac
            echo "Found $COUNT outdated packages" >> $GITHUB_STEP_SUMMARY
            echo "count=$COUNT" >> $GITHUB_OUTPUT
          else
            echo "All dependencies are up to date" >> $GITHUB_STEP_SUMMARY
            echo "count=0" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true
      
      # 4. Auditoría con Snyk (si está configurado)
      - name: Snyk Security Scan
        id: snyk
        if: env.SNYK_TOKEN != ''
        uses: snyk/actions/node@b075801f26076be9bb50521154cafab73f44da0c # master @ 2026-09-29
        continue-on-error: true
        with:
          args: --severity-threshold=high --json-file-output=snyk-report.json
      
      # 5. Auditoría con OSV Scanner
      - name: OSV Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=pnpm-lock.yaml
            --format=json
            --output=osv-report.json
      
      # 6. Upload artifacts para análisis
      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-reports
          path: |
            pnpm-audit.json
            pnpm-audit-prod.json
            outdated.json
            snyk-report.json
            osv-report.json
          retention-days: 30
      
      # 7. Crear issue SOLO si hay vulnerabilidades de producción reales
      #    (sin `|| failure()` para no abrir issues vacías cuando falla infra)
      - name: Create issue for production vulnerabilities
        if: steps.pnpm-audit-prod.outputs.vulnerabilities != '' && steps.pnpm-audit-prod.outputs.vulnerabilities != '0'
        env:
          PROD_VULNS: ${{ steps.pnpm-audit-prod.outputs.vulnerabilities }}
          OUTDATED_COUNT: ${{ steps.outdated.outputs.count }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prodVulns = process.env.PROD_VULNS || 'desconocido';
            const outdatedCount = process.env.OUTDATED_COUNT || 'desconocido';
            const title = '🔒 Security Alert: Production Vulnerabilities Detected';
            const body = `
            ## Security Audit Results

            **Date**: ${new Date().toISOString()}
            **Workflow**: ${context.workflow}
            **Run**: ${context.runNumber}

            ### Summary
            - pnpm audit (production): ${prodVulns} vulnerabilities
            - Outdated packages: ${outdatedCount}

            ### Actions Required
            1. Review the security reports in the workflow artifacts
            2. Update vulnerable production dependencies
            3. Run \`pnpm audit --prod\` locally for details
            4. Check Snyk dashboard if configured

            ### Quick Fix
            \`\`\`bash
            # Update dependencies
            pnpm update

            # Verify
            pnpm audit --prod
            pnpm test-headless
            pnpm build
            \`\`\`

            [View Workflow Run](${context.payload.repository.html_url}/actions/runs/${context.runId})
            `;
            
            // Check if issue already exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'security'
            });
            
            const existingIssue = issues.data.find(issue => issue.title === title);
            
            if (!existingIssue) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['security', 'automated']
              });
            }
      
      # 8. Comentar en PR solo si hay vulnerabilidades de producción
      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.pnpm-audit-prod.outputs.vulnerabilities != '' && steps.pnpm-audit-prod.outputs.vulnerabilities != '0'
        env:
          PROD_VULNS: ${{ steps.pnpm-audit-prod.outputs.vulnerabilities }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const prodVulns = process.env.PROD_VULNS || 'desconocido';
            const comment = `
            ## 🔒 Security Audit Results

            ❌ **Production vulnerabilities detected**: ${prodVulns}

            Please review and fix these before merging.

            ### Quick commands
            \`\`\`bash
            pnpm audit --prod
            pnpm outdated
            pnpm update
            \`\`\`
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });
      
      # 9. Warn if dev vulnerabilities are found (do not fail the workflow)
      - name: Warn on dev vulnerabilities
        if: steps.pnpm-audit-dev.outputs.vulnerabilities != '' && steps.pnpm-audit-dev.outputs.vulnerabilities != '0'
        run: |
          echo "::warning::Dev/toolchain vulnerabilities found (${{ steps.pnpm-audit-dev.outputs.vulnerabilities }}). Production gate passed; review accepted risks in SECURITY_AUDIT_ANALYSIS.md."
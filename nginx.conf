server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Todo lo que emite Vite bajo /assets/ lleva hash de contenido
    # (index-XXXXXXXX.js, index-XXXXXXXX.css): inmutable durante un año.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Resto de estaticos sin hash (favicon, media de public/): cache corto y
    # 404 si no existen, en vez de devolver el index.html como fallback SPA.
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp|avif|map|txt)$ {
        expires 1h;
        try_files $uri =404;
    }

    # index.html nunca se cachea para que un despliegue nuevo se sirva al instante.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Fallback SPA: las rutas de Vue Router (/home, /categorias, ...) resuelven
    # al index.html y el router decide.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
